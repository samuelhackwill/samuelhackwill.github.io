<html  dir="auto" >
<head>
<link rel="icon" 
      type="image/png" 
      href="favicon.png">
<title>game</title>
<style>
	body {
		margin:40px;
		padding:40px;
	}
</style>
<script>

var embedDat = "%7B%221%22:%5B%5B%22you%20thank%20the%20HR%20person%20and%20take%20off%20your%20corporate%20shoes%22%5D,%5B%22%22%5D,%5B%22you%20didn't%20have%20socks%20on%22,%22CONCLUSIONGOOD%22%5D,%5B%22%22%5D%5D,%222%22:%5B%5B%22you%20tell%20the%20HR%20person%20please%20can%20i%20keep%20my%20job,%20because%20reason%22%5D,%5B%22%22%5D,%5B%22they%20are%20convinced,%20you%20keep%20your%20job%22,%22CONCLUSIONBAD%22%5D,%5B%22%22%5D%5D,%223%22:%5B%5B%22you%20enter%20a%20fistfight%20with%20the%20HR%20person.%20Nothing%20personnal%20but%20Nietzsche%20said%20that%20forgivness%20and%20vendetta,%20all%20in%20all,%20are%20both%20ways%20of%20finding%20reparation.%22%5D,%5B%22%22%5D,%5B%22security%20kicks%20you%20out%20of%20the%20corporate%20building.%22,%22CONCLUSIONGOOD%22%5D,%5B%22%22%5D%5D,%224%22:%5B%5B%22no%20amount%20of%20blurting%20will%20restore%20the%20confidence%20your%20boss%20lost%20in%20you%20because%20you%20made%20that%20terrible%20mistake%20last%20quarter.%22%5D,%5B%22%22%5D,%5B%22stop%20blurting%22,%22START%22%5D,%5B%22%22%5D%5D,%22START%22:%5B%5B%22you%20are%20getting%20fired%22%5D,%5B%22%22%5D,%5B%22accept%22,%221%22%5D,%5B%22refuse%22,%222%22%5D,%5B%22fight%22,%223%22%5D,%5B%22blurt%22,%224%22%5D,%5B%22%22%5D%5D,%22__STARTSECTION__%22:%22START%22,%22CONCLUSIONBAD%22:%5B%5B%22you%20kept%20your%20job%20which%20sucks%22%5D,%5B%22%22%5D%5D,%22CONCLUSIONGOOD%22:%5B%5B%22you%20finaly%20can%20go%20hiking%20in%20the%20mountains%20with%20all%20you%20jobless%20friends%22%5D%5D%7D";

var gameState = null;


var aurl = document.createElement('a');
function qualifyURL(url) {
 aurl.href = url;
 return aurl.href;
}

function getParameterByName(name) {
    name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
        results = regex.exec(location.search);
    return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

function strip_http(url) {
   url = url.replace(/^https?:\/\//,'');
   return url;
}

function startSection(){
  if (gameState==null){
    return "";
  }
  var param = getParameterByName("section");

  var result = "__STARTSECTION__" in gameState ? gameState["__STARTSECTION__"] : "START";
  if (param.length>0){
    result=param;
  }

  return result;
}

function init(){
	if (embedDat.length>0 && embedDat[0]!=='_'){
		var dat = decodeURI(embedDat);
		gameState = JSON.parse(dat);
    var startKey = startSection();
		goTo(startKey);
		return;
	}

var id = getParameterByName("p").replace(/[\\\/]/,"");
  if (id===null||id.length===0) {
    console.log("No ID specified in URL.")
    return;
  }

  var githubURL = 'https://api.github.com/gists/'+id;

  var githubHTTPClient = new XMLHttpRequest();
  githubHTTPClient.open('GET', githubURL);
  githubHTTPClient.onreadystatechange = function() {
    if(githubHTTPClient.readyState!=4) {
      return;
    }   
    var result = JSON.parse(githubHTTPClient.responseText);
    if (githubHTTPClient.status===403) {
      console.log(result.message);
    } else if (githubHTTPClient.status!==200&&githubHTTPClient.status!==201) {
      console.log("HTTP Error "+ githubHTTPClient.status + ' - ' + githubHTTPClient.statusText);
    }
    var result = JSON.parse(githubHTTPClient.responseText);
    var code=result["files"]["game.txt"]["content"];
    console.log(code);

	gameState = JSON.parse(code);
	goTo(startSection());
  }
  githubHTTPClient.setRequestHeader("Content-type","application/x-www-form-urlencoded");
  githubHTTPClient.send();

	goTo(startSection());
}	

function escapeHtmlEntities (str) {
  if (typeof jQuery !== 'undefined') {
    // Create an empty div to use as a container,
    // then put the raw text in and get the HTML
    // equivalent out.
    return jQuery('<div/>').text(str).html();
  }

  // No jQuery, so use string replace.
  return str
    .replace(/&/g, '&amp;')
    .replace(/>/g, '&gt;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}

function goTo(targetState){
  if (gameState==null){
    return;
  }
	var curstate = gameState[targetState];
	var gameArea = document.getElementById("gameArea");
	var str = "";
	for (var i=0;i<curstate.length;i++){
		var l = curstate[i];
		if (l.length==1){			
			str+=escapeHtmlEntities(l[0])+"<br>";
		} else if (l.length==2){
			str+='<a href="#" onclick="goTo(\''+escapeHtmlEntities(l[1])+'\');return false;">'+escapeHtmlEntities(l[0])+'</a><br>';
		}	
	}
	gameArea.innerHTML=str;
}

</script>
</head>
<body onload="init();" dir="auto">
<div id="gameArea" dir="auto"></div>
</body>
</html>
