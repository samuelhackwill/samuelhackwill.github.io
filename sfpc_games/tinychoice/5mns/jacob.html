<html  dir="auto" >
<head>
<link rel="icon" 
      type="image/png" 
      href="favicon.png">
<title>game</title>
<style>
	body {
		margin:40px;
		padding:40px;
	}
</style>
<script>

var embedDat = "%7B%221%22:%5B%5B%22you%20hear%20Jacob%20yelling%20in%20the%20courtyard.%20Jacob%20was%20always%20going%20to%20be%20braver%20and%20more%20creative%20than%20you%22%5D,%5B%22%22%5D,%5B%22we%20all%20love%20jacob%22,%22CONCLUSION%22%5D,%5B%22%22%5D%5D,%222%22:%5B%5B%22you%20try%20to%20challenge%20Jacob,%20but%20you%20know%20that%20you%20shouldn't%20have.%20Jacob%20goes%20downstairs%20and%20pry%20the%20gate%20of%20the%20bicycle%20garage%20open%20out%20of%20sheer%20will.%22%5D,%5B%22%22%5D,%5B%22Jacob%20is%20strong%20because%20he%20drinks%20vinegar.%22,%22CONCLUSION%22%5D,%5B%22%22%5D%5D,%223%22:%5B%5B%22Only%20unconfident%20people%20think%20they%20need%20keys%20to%20open%20locked%20doors,%20get%20a%20grip%20man!%20Jacob%20trusts%20himself%20but%20he%20still%20gets%20the%20key%20in%20the%20hall.%22%5D,%5B%22%22%5D,%5B%22you%20hear%20him%20open%20the%20bicycle%20garage%22,%22CONCLUSION%22%5D,%5B%22%22%5D%5D,%22START%22:%5B%5B%22Jacob%20is%20going%20out%20and%20he%20asks%20you%20for%20the%20key%20to%20the%20bicycle%20garage.%22%5D,%5B%22%22%5D,%5B%22but%20you%20don't%20have%20to%20give%20it%20to%20him.%22%5D,%5B%22%22%5D,%5B%22oh%20well%20hum%20you%20know%20we%20don't%20really%20use%20a%20key%20anymore%20you%20have%20to%20yell%20at%20the%20door%20and%20it'll%20open%22,%221%22%5D,%5B%22the%20key....%20how%20petty%20of%20you%20Jacob%22,%222%22%5D,%5B%22man,%20trust%20yourself%20you%20know%22,%223%22%5D,%5B%22%22%5D%5D,%22__STARTSECTION__%22:%22START%22,%22CONCLUSION%22:%5B%5B%22jacob%20wins.%22%5D%5D%7D";

var gameState = null;


var aurl = document.createElement('a');
function qualifyURL(url) {
 aurl.href = url;
 return aurl.href;
}

function getParameterByName(name) {
    name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
        results = regex.exec(location.search);
    return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

function strip_http(url) {
   url = url.replace(/^https?:\/\//,'');
   return url;
}

function startSection(){
  if (gameState==null){
    return "";
  }
  var param = getParameterByName("section");

  var result = "__STARTSECTION__" in gameState ? gameState["__STARTSECTION__"] : "START";
  if (param.length>0){
    result=param;
  }

  return result;
}

function init(){
	if (embedDat.length>0 && embedDat[0]!=='_'){
		var dat = decodeURI(embedDat);
		gameState = JSON.parse(dat);
    var startKey = startSection();
		goTo(startKey);
		return;
	}

var id = getParameterByName("p").replace(/[\\\/]/,"");
  if (id===null||id.length===0) {
    console.log("No ID specified in URL.")
    return;
  }

  var githubURL = 'https://api.github.com/gists/'+id;

  var githubHTTPClient = new XMLHttpRequest();
  githubHTTPClient.open('GET', githubURL);
  githubHTTPClient.onreadystatechange = function() {
    if(githubHTTPClient.readyState!=4) {
      return;
    }   
    var result = JSON.parse(githubHTTPClient.responseText);
    if (githubHTTPClient.status===403) {
      console.log(result.message);
    } else if (githubHTTPClient.status!==200&&githubHTTPClient.status!==201) {
      console.log("HTTP Error "+ githubHTTPClient.status + ' - ' + githubHTTPClient.statusText);
    }
    var result = JSON.parse(githubHTTPClient.responseText);
    var code=result["files"]["game.txt"]["content"];
    console.log(code);

	gameState = JSON.parse(code);
	goTo(startSection());
  }
  githubHTTPClient.setRequestHeader("Content-type","application/x-www-form-urlencoded");
  githubHTTPClient.send();

	goTo(startSection());
}	

function escapeHtmlEntities (str) {
  if (typeof jQuery !== 'undefined') {
    // Create an empty div to use as a container,
    // then put the raw text in and get the HTML
    // equivalent out.
    return jQuery('<div/>').text(str).html();
  }

  // No jQuery, so use string replace.
  return str
    .replace(/&/g, '&amp;')
    .replace(/>/g, '&gt;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}

function goTo(targetState){
  if (gameState==null){
    return;
  }
	var curstate = gameState[targetState];
	var gameArea = document.getElementById("gameArea");
	var str = "";
	for (var i=0;i<curstate.length;i++){
		var l = curstate[i];
		if (l.length==1){			
			str+=escapeHtmlEntities(l[0])+"<br>";
		} else if (l.length==2){
			str+='<a href="#" onclick="goTo(\''+escapeHtmlEntities(l[1])+'\');return false;">'+escapeHtmlEntities(l[0])+'</a><br>';
		}	
	}
	gameArea.innerHTML=str;
}

</script>
</head>
<body onload="init();" dir="auto">
<div id="gameArea" dir="auto"></div>
</body>
</html>
