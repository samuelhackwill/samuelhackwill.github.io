<html  dir="auto" >
<head>
<link rel="icon" 
      type="image/png" 
      href="favicon.png">
<title>game</title>
<style>
	body {
		margin:40px;
		padding:40px;
	}
</style>
<script>

var embedDat = "%7B%221%22:%5B%5B%22you%20shouldn't%20buy%20a%20cheap%20house%20in%20the%20countryside,%20because%20you'll%20never%20be%20able%20to%20sell%20it%20again%20later.%20You're%20locked%20in%20the%20countryside%20forever,%20condemned%20to%20listen%20to%20your%20neightboors%20complaining%20about%20one%20another.%20You%20tell%20Jacob.%22%5D,%5B%22%22%5D,%5B%22ok%20so%20should%20he%20buy%20two%20instead%20because%20theyre%20cheap%22,%222%22%5D,%5B%22what%20kind%20of%20party%20could%20you%20buy%20with%20that%20money?%22,%223%22%5D,%5B%22%22%5D%5D,%222%22:%5B%5B%22yes.%20Takes%20these%20two%20houses%20and%20combine%20them%20into%20a%20factory%20where%20you%20start%20making%20bread.%20You%20start%20with%20one%20oven,%20then%20two,%20then%20three,%20then%20you%20buy%20out%20the%20competition,%20then%20you%20buy%20the%20whole%20village,%20and%20all%20of%20france's%20bakery.%20You%20tell%20Jacob%20that's%20the%20winning%20choice%22%5D,%5B%22%22%5D,%5B%22cool%22,%22CONCLUSION%22%5D,%5B%22%22%5D%5D,%223%22:%5B%5B%22you%20could%20probably%20buy%203000%20bottles%20of%20champagne%20for%20the%20price%20of%20the%20house.%20Sounds%20like%20a%20fun%20party%22%5D,%5B%22%22%5D,%5B%22you%20should%20do%20that%20Jacob!%22,%22CONCLUSION%22%5D,%5B%22%22%5D%5D,%22START%22:%5B%5B%22Jacob%20is%20buying%20a%20super%20cheap%20house%20in%20the%20countryside.%22%5D,%5B%22%22%5D,%5B%22dont%20do%20that%22,%221%22%5D,%5B%22buy%20two%20because%20theyre%20cheap%22,%222%22%5D,%5B%22what%20kind%20of%20party%20could%20you%20buy%20with%20that%20money?%22,%223%22%5D,%5B%22%22%5D%5D,%22__STARTSECTION__%22:%22START%22,%22CONCLUSION%22:%5B%5B%22Jacob%20moves%20to%20the%20countryside%20anyway.%22%5D%5D%7D";

var gameState = null;


var aurl = document.createElement('a');
function qualifyURL(url) {
 aurl.href = url;
 return aurl.href;
}

function getParameterByName(name) {
    name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
        results = regex.exec(location.search);
    return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

function strip_http(url) {
   url = url.replace(/^https?:\/\//,'');
   return url;
}

function startSection(){
  if (gameState==null){
    return "";
  }
  var param = getParameterByName("section");

  var result = "__STARTSECTION__" in gameState ? gameState["__STARTSECTION__"] : "START";
  if (param.length>0){
    result=param;
  }

  return result;
}

function init(){
	if (embedDat.length>0 && embedDat[0]!=='_'){
		var dat = decodeURI(embedDat);
		gameState = JSON.parse(dat);
    var startKey = startSection();
		goTo(startKey);
		return;
	}

var id = getParameterByName("p").replace(/[\\\/]/,"");
  if (id===null||id.length===0) {
    console.log("No ID specified in URL.")
    return;
  }

  var githubURL = 'https://api.github.com/gists/'+id;

  var githubHTTPClient = new XMLHttpRequest();
  githubHTTPClient.open('GET', githubURL);
  githubHTTPClient.onreadystatechange = function() {
    if(githubHTTPClient.readyState!=4) {
      return;
    }   
    var result = JSON.parse(githubHTTPClient.responseText);
    if (githubHTTPClient.status===403) {
      console.log(result.message);
    } else if (githubHTTPClient.status!==200&&githubHTTPClient.status!==201) {
      console.log("HTTP Error "+ githubHTTPClient.status + ' - ' + githubHTTPClient.statusText);
    }
    var result = JSON.parse(githubHTTPClient.responseText);
    var code=result["files"]["game.txt"]["content"];
    console.log(code);

	gameState = JSON.parse(code);
	goTo(startSection());
  }
  githubHTTPClient.setRequestHeader("Content-type","application/x-www-form-urlencoded");
  githubHTTPClient.send();

	goTo(startSection());
}	

function escapeHtmlEntities (str) {
  if (typeof jQuery !== 'undefined') {
    // Create an empty div to use as a container,
    // then put the raw text in and get the HTML
    // equivalent out.
    return jQuery('<div/>').text(str).html();
  }

  // No jQuery, so use string replace.
  return str
    .replace(/&/g, '&amp;')
    .replace(/>/g, '&gt;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}

function goTo(targetState){
  if (gameState==null){
    return;
  }
	var curstate = gameState[targetState];
	var gameArea = document.getElementById("gameArea");
	var str = "";
	for (var i=0;i<curstate.length;i++){
		var l = curstate[i];
		if (l.length==1){			
			str+=escapeHtmlEntities(l[0])+"<br>";
		} else if (l.length==2){
			str+='<a href="#" onclick="goTo(\''+escapeHtmlEntities(l[1])+'\');return false;">'+escapeHtmlEntities(l[0])+'</a><br>';
		}	
	}
	gameArea.innerHTML=str;
}

</script>
</head>
<body onload="init();" dir="auto">
<div id="gameArea" dir="auto"></div>
</body>
</html>
