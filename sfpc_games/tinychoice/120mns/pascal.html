var embedDat = "%7B%22START%22:%5B%5B%22TW%20:%20death,%20illness,%20alcohol.%22%5D,%5B%22%22%5D,%5B%22You're%20picking%20grapes%20in%20JD's%20vineyard%20not%20too%20far%20from%20the%20empty%20diagonal.%22%5D,%5B%22%22%5D,%5B%22You%20like%20picking%20grapes.%20It's%20a%20break%20from%20looking%20at%20a%20screen%20in%20the%20city.%22%5D,%5B%22%22%5D,%5B%22Look%20at%20a%20bunch%20of%20grape%22,%22GRAPE%22%5D,%5B%22Look%20at%20your%20phone%22,%22PHONE%22%5D,%5B%22%22%5D%5D,%22__STARTSECTION__%22:%22START%22,%22PHONE%22:%5B%5B%22it's%207%20AM.%20No%20notifications.%20Deborah%20will%20be%20calling%20later.%22%5D,%5B%22%22%5D,%5B%22Look%20at%20a%20bunch%20grape%22,%22GRAPE%22%5D,%5B%22%22%5D%5D,%22GRAPE%22:%5B%5B%22Cutting%20its%20stem,%20you%20hold%20a%20bunch%20of%20grapes%20in%20the%20air.%20It's%20covered%20with%20morning%20dew,%20sunlight%20piercing%20through%20its%20golden%20flesh.%20You%20can%20see%20every%20individual%20grape%20seed%20through%20the%20translucent%20skin.%20Sauvignon.%22%5D,%5B%22%22%5D,%5B%22Eat%20the%20bunch%20of%20grapes%22,%22TASTE%22%5D,%5B%22Put%20the%20grape%20in%20your%20bucket%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22TASTE%22:%5B%5B%22You%20take%20an%20indulgent%20bite.%20You%20get%20hit%20with%20a%20comforting%20and%20ambiguous%20bouquet.%22%5D,%5B%22%22%5D,%5B%22You%20can't%20make%20wine%20with%20these%20grapes.%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22Wait,%20you%20can't?%20so%20why%20am%20i%20picking%20these%20grapes%22,%22FERMENTATION%22%5D,%5B%22%22%5D%5D,%22FERMENTATION%22:%5B%5B%22the%20grapes%20in%20this%20vineyard%20have%20matured%20for%20a%20little%20too%20long.%20They%20have%20had%20too%20much%20sun,%20and%20contain%20too%20much%20sugar,%20so%20you%20can't%20use%20them%20to%20make%20wine.%20At%20least%20not%20if%20you're%20making%20so%20called%20natural%20wine,%20where%20sulfites%20are%20verboten.%20Once%20it's%20started,%20there's%20no%20interrupting%20the%20fermentation%20process%20in%20your%20soon-to-be-wine%20hectolitres,%20like%20they%20do%20in%20so%20called%20conventional%20winemaking.%20When%20you%20can't%20just%20dump%20sulfur%20dioxyde%20in%20your%20vats,%20the%20yeast%20will%20continue%20transforming%20sugar%20into%20alcohol%20until%20everything's%20gone%20and%20you're%20left%20with%20a%20boozy%20beverage.%22%5D,%5B%22%22%5D,%5B%22And%20anything%20surpassing%2016%C2%B0%20of%20alcohol%20is%20pretty%20much%20offside%20as%20far%20as%20wine%20is%20concerned.%22%5D,%5B%22%22%5D,%5B%22okay%22,%22FERMENTATION2%22%5D,%5B%22%22%5D%5D,%22FERMENTATION2%22:%5B%5B%22So%20the%20plan%20today%20is%20to%20use%20these%20grapes%20to%20make%20a%20special%20beverage%20called%20%5C%22mistelle%5C%22,%20which%20is%20a%20mixture%20of%20hooch%20and%20grape%20juice.%20Every%20region%20in%20france%20appropriately%20calls%20it%20a%20different%20name.%22%5D,%5B%22%22%5D,%5B%22What's%20it%20called%20in%20Beaujolais?%22,%22RIKIKI%22%5D,%5B%22What's%20it%20called%20in%20Champagne?%22,%22RATAFIA%22%5D,%5B%22what's%20it%20called%20in%20Jura?%22,%22MACVIN%22%5D,%5B%22what's%20it%20called%20in%20Gascony?%22,%22FLOC%22%5D,%5B%22what's%20it%20called%20here?%20(in%20Touraine)%22,%22NOIDEA%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22NOIDEA%22:%5B%5B%22you're%20actually%20not%20sure%20about%20this.%20You%20simply%20call%20it%20%5C%22ratafia%5C%22,%20because%20that's%20what%20they%20call%20it%20in%20Champagne.%20Confusing.%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22RIKIKI%22:%5B%5B%22it's%20called%20%5C%22rikiki%5C%22.%20Which%20also%20means%20%5C%22tiny%20winy%5C%22.%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22RATAFIA%22:%5B%5B%22it's%20called%20%5C%22ratafia%5C%22.%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22MACVIN%22:%5B%5B%22it's%20called%20%5C%22macvin%5C%22.%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22FLOC%22:%5B%5B%22it's%20called%20%5C%22floc%5C%22.%22%5D,%5B%22%22%5D,%5B%22Carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22BUCKET%22:%5B%5B%22You%20carry%20on%20picking%20grapes.%22%5D,%5B%22%22%5D,%5B%22Time%20to%20have%20a%20conversation%20with%20the%20others.%22%5D,%5B%22%22%5D,%5B%22Jacob%20is%20your%20friend.%20He's%20the%20reason%20you're%20here.%20He%20actually%20is%20the%20reason%20everyone's%20here,%20because%20he's%20the%20one%20who%20had%20the%20idea%20of%20using%20these%20grapes%20to%20make%20mistelle.%20You%20all%20could've%20had%20a%20nice%20sleep-in.%22%5D,%5B%22%22%5D,%5B%22JD%20is%20the%20winemaker.%22%5D,%5B%22%22%5D,%5B%22Joelle's%20a%20farmhand.%20You%20feel%20cautious%20around%20her.%20She's%20very%20countryside.%22%5D,%5B%22%22%5D,%5B%22Talk%20with%20Jacob%22,%22JACOB%22%5D,%5B%22Talk%20with%20JD%22,%22JD%22%5D,%5B%22Talk%20with%20Tthierry%22,%22THIERRY%22%5D,%5B%22Talk%20with%20Joelle%22,%22JOELLE%22%5D,%5B%22remain%20silent%20and%20focused%20on%20your%20job%20(conclusion)%22,%22CONCLUSION%22%5D,%5B%22%22%5D%5D,%22JACOB%22:%5B%5B%22You%20joke%20with%20Jacob%20about%20the%20fact%20that%20by%20coincidence,%20everybody%20that%20you%20met%20yesterday%20as%20he%20showed%20you%20around%20his%20village%20were%20pulling%20their%20trousers%20up%20as%20they%20opened%20their%20front%20door.%22%5D,%5B%22%22%5D,%5B%22Jacob%20is%20moving%20from%20Paris%20to%20the%20countryside.%22%5D,%5B%22%22%5D,%5B%22you%20wonder%20if%20he%20too%20will%20stop%20wearing%20a%20belt%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22JD%22:%5B%5B%22JD%20talks%20in%20rapid%20bursts,%20looking%20straight%20in%20front%20of%20him%20while%20he%20collects%20grapes%20at%20unnatural%20speed.%20You%20are%20aware%20that%20he%20experienced%20a%20traumatic%20loss%20a%20couple%20of%20months%20ago,%20when%20P.P.%20suddenly%20died%20in%20the%20middle%20of%20his%20dinner.%20P.P.%20was%20his%20mentor%20and%20also%20a%20friend%20of%20everyone%20present%20in%20the%20plot,%20including%20you.%22%5D,%5B%22%22%5D,%5B%22You%20are%20deeply%20troubled%20by%20P.P.'s%20absence.%20His%20voice%20used%20to%20flood%20the%20vineyard%20with%20jokes,%20deeply%20technical%20talk%20about%20sparkling%20wine,%20and%20his%20visions%20for%20the%20disturbed%20future%20of%20winemaking.%22%5D,%5B%22%22%5D,%5B%22grief%20is%20a%20strange%20process%20and%20can%20make%20people%20weird.%20You%20hope%20JD%20will%20manage%20to%20find%20peace%20after%20that%20terrible%20blow.%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22THIERRY%22:%5B%5B%22Thierry%20is%20not%20the%20talkative%20type.%20Later%20today%20he'll%20make%20a%20gorgeous%20salad%20for%20all%20of%20you%20with%20extra-ripe%20tomatoes,%20parsnip,%20parsley,%20cucumber,%20garlic%20and%20beans,%20everything%20exclusive%20from%20Sabrina's%20garden.%20Joelle%20will%20remark%20that%20Thierry's%20salad%20looks%20better%20than%20the%20one%20you%20made%20yesterday.%22%5D,%5B%22%22%5D,%5B%22you%20aren't%20aware%20of%20the%20menu%20yet%20but%20what%20you%20know%20for%20sure%20is%20that%20you'll%20be%20hungry%20soon%20and%20that%20whatever%20you%20eat%20at%20lunch,%20it%20will%20taste%20incredible%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22JOELLE%22:%5B%5B%22Joelle%20says%20that%20she%20was%20in%20the%20hospital%20last%20week%20because%20she%20hadn't%20been%20able%20to%20pass%20stools%20for%20a%20week.%20She%20says%20that%20her%20doctor%20forced%20her%20to%20seek%20help,%20and%20that%20later%20at%20the%20hospital,%20they%20told%20her%20that%20she%20would've%20probably%20died%20if%20she'd%20waited%20one%20more%20day.%22%5D,%5B%22%22%5D,%5B%22Joelle%20isn't%20used%20to%20complaining.%20She's%20not%20made%20from%20the%20same%20material%20as%20any%20of%20you%20in%20the%20plot.%20She's%20indestructible.%22%5D,%5B%22%22%5D,%5B%22the%20conversation%20makes%20you%20grateful%20for%20having%20a%20functioning%20gastrointestinal%20system.%20You%20thank%20your%20bowels%20and%20carry%20on%20picking%20grapes%22,%22BUCKET%22%5D,%5B%22%22%5D%5D,%22CONCLUSION%22:%5B%5B%22you%20are%20in%20autopilot,%20filling%20your%20bucket%20faster%20than%20anyone%20else%20on%20the%20plot.%20You%20don't%20even%20need%20to%20look%20at%20your%20pruners%20any%20more,%20your%20hands%20feeling%20their%20way%20through%20the%20foliage%20to%20collect%20the%20grapes.%20You're%20having%20a%20great%20day.%22%5D,%5B%22%22%5D,%5B%22your%20phone%20rings%22,%22END%22%5D,%5B%22%22%5D%5D,%22END%22:%5B%5B%22it's%20Deborah,%20you%20love%20her%20and%20haven't%20talked%20with%20her%20for%20a%20couple%20of%20days.%20Time%20for%20a%20break.%22%5D,%5B%22%22%5D,%5B%22game%20over%22,%22CREDITS%22%5D,%5B%22%22%5D%5D,%22CREDITS%22:%5B%5B%22tinygame%20by%20Samuel%20Hackwill.%22%5D,%5B%22Special%20thanks%20to%20Jacob%20for%20introducing%20me%20to%20the%20Touraine%20crew.%22%5D,%5B%22in%20memory%20of%20Pascal%20Potaire%22%5D,%5B%22%22%5D%5D%7D";

var gameState = null;


var aurl = document.createElement('a');
function qualifyURL(url) {
 aurl.href = url;
 return aurl.href;
}

function getParameterByName(name) {
    name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
        results = regex.exec(location.search);
    return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

function strip_http(url) {
   url = url.replace(/^https?:\/\//,'');
   return url;
}

function startSection(){
  if (gameState==null){
    return "";
  }
  var param = getParameterByName("section");

  var result = "__STARTSECTION__" in gameState ? gameState["__STARTSECTION__"] : "START";
  if (param.length>0){
    result=param;
  }

  return result;
}

function init(){
	if (embedDat.length>0 && embedDat[0]!=='_'){
		var dat = decodeURI(embedDat);
		gameState = JSON.parse(dat);
    var startKey = startSection();
		goTo(startKey);
		return;
	}

var id = getParameterByName("p").replace(/[\\\/]/,"");
  if (id===null||id.length===0) {
    console.log("No ID specified in URL.")
    return;
  }

  var githubURL = 'https://api.github.com/gists/'+id;

  var githubHTTPClient = new XMLHttpRequest();
  githubHTTPClient.open('GET', githubURL);
  githubHTTPClient.onreadystatechange = function() {
    if(githubHTTPClient.readyState!=4) {
      return;
    }   
    var result = JSON.parse(githubHTTPClient.responseText);
    if (githubHTTPClient.status===403) {
      console.log(result.message);
    } else if (githubHTTPClient.status!==200&&githubHTTPClient.status!==201) {
      console.log("HTTP Error "+ githubHTTPClient.status + ' - ' + githubHTTPClient.statusText);
    }
    var result = JSON.parse(githubHTTPClient.responseText);
    var code=result["files"]["game.txt"]["content"];
    console.log(code);

	gameState = JSON.parse(code);
	goTo(startSection());
  }
  githubHTTPClient.setRequestHeader("Content-type","application/x-www-form-urlencoded");
  githubHTTPClient.send();

	goTo(startSection());
}	

function escapeHtmlEntities (str) {
  if (typeof jQuery !== 'undefined') {
    // Create an empty div to use as a container,
    // then put the raw text in and get the HTML
    // equivalent out.
    return jQuery('<div/>').text(str).html();
  }

  // No jQuery, so use string replace.
  return str
    .replace(/&/g, '&amp;')
    .replace(/>/g, '&gt;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}

function goTo(targetState){
  if (gameState==null){
    return;
  }
	var curstate = gameState[targetState];
	var gameArea = document.getElementById("gameArea");
	var str = "";
	for (var i=0;i<curstate.length;i++){
		var l = curstate[i];
		if (l.length==1){			
			str+=escapeHtmlEntities(l[0])+"<br>";
		} else if (l.length==2){
			str+='<a href="#" onclick="goTo(\''+escapeHtmlEntities(l[1])+'\');return false;">'+escapeHtmlEntities(l[0])+'</a><br>';
		}	
	}
	gameArea.innerHTML=str;
}

</script>
